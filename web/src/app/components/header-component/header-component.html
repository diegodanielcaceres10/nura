<header [class.header-sticky]="isSticky()" [class.header-blur]="isMenuOpen()" class="header">
  <div class="header__inner">
    <div class="header__logo">
      <div class="header__logo-icon-wrapper">
        <img src="favicon-32x32.png" alt="Nura Logo" width="32" height="32" decoding="async" />
      </div>
      <span class="header__brand">
        <a (click)="toogleMenu()" [routerLink]="['/', currentLang()]" fragment="home">
          <span class="header__brand-title">NURA</span>
        </a>
      </span>
    </div>

    <button type="button" (click)="toogleMenu()" class="header__button" aria-label="Toggle menu" [attr.aria-expanded]="isMenuOpen()" aria-controls="primary-navigation">
      <i [class.hide]="isMenuOpen()" class="fa-solid fa-bars" aria-hidden="true"></i>
      <i [class.hide]="!isMenuOpen()" class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>

    <div [class.header__container-open]="isMenuOpen()" class="header__container">
      <nav id="primary-navigation" class="header__nav" aria-label="Primary navigation">
        <a (click)="toogleMenu()" [routerLink]="['/', currentLang()]" fragment="experiences">{{ 'MENU_EXPERIENCE' | translate }}</a>
        <a (click)="toogleMenu()" [routerLink]="['/', currentLang()]" fragment="projects">{{ 'MENU_PROJECTS' | translate }}</a>
        <a (click)="toogleMenu()" [routerLink]="['/', currentLang()]" fragment="recommendations">{{ 'MENU_RECOMMENDATIONS' | translate }}</a>
        <a (click)="toogleMenu()" [routerLink]="['/', currentLang()]" fragment="about">{{ 'MENU_ABOUT_ME' | translate }}</a>
        <a (click)="toogleMenu()" [routerLink]="['/', currentLang()]" fragment="contact">{{ 'MENU_CONTACT' | translate }}</a>
      </nav>
      <div class="header__langs" [class.header__langs-open]="isLangOpen()">
        <button type="button" class="header__langs-trigger" aria-haspopup="listbox" aria-label="Language" [attr.aria-expanded]="isLangOpen()" (click)="toggleLang()" (keydown)="onTriggerKeydown($event)">
          <span class="header__langs-current">{{ currentLangOption().flag }}</span>
          <i class="fa-solid fa-chevron-down header__langs-chevron" aria-hidden="true"></i>
        </button>
        @if (isLangOpen()) {
          <div class="header__langs-menu" role="listbox" aria-label="Language">
            @for (lang of langs; track lang.code; let i = $index) {
              <button type="button" role="option" class="header__lang" [class.active]="currentLang() === lang.code" [attr.aria-selected]="currentLang() === lang.code" [attr.lang]="lang.code" (click)="selectLang(lang.code)" (keydown)="onOptionKeydown($event, i)">
                <span class="header__lang-code">{{ lang.flag }}</span>
                <span class="header__lang-name">{{ lang.name }}</span>
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>
</header>
