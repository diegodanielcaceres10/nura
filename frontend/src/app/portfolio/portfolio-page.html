<app-header-component />
<main>
  <app-home-component id="home" />
  @defer (on viewport) {
    <app-about-component id="about" />
  }
  @placeholder {
    <section aria-hidden="true" class="defer-placeholder"></section>
  }
  @defer (on viewport) {
    <app-experiences-component id="experiences" />
  }
  @placeholder {
    <section aria-hidden="true" class="defer-placeholder"></section>
  }
  @defer (on viewport) {
    <app-projects-component id="projects" />
  }
  @placeholder {
    <section aria-hidden="true" class="defer-placeholder"></section>
  }
</main>
<div [class.show]="isSticky()" class="scroll_to_top">
  <a [routerLink]="[]" fragment="home" aria-label="Back to top"><i class="fa-solid fa-circle-up"></i></a>
</div>
@defer (on viewport) {
  <app-footer-component id="contact" />
}
@placeholder {
  <section aria-hidden="true" class="defer-placeholder defer-placeholder--footer"></section>
}
